<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="xterm.min.css" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1e1e2e; overflow: hidden;
  }
  #terminal { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.min.js"></script>
<script src="xterm-addon-fit.min.js"></script>
<script>
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'monospace',
    scrollback: 1000,
    theme: {
      background: '#1e1e2e',
      foreground: '#cdd6f4',
      cursor: '#cba6f7'
    }
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));

  function doFit() {
    fitAddon.fit();
    if (window.AndroidBridge) {
      window.AndroidBridge.onResize(term.rows, term.cols);
    }
  }
  setTimeout(doFit, 150);
  window.addEventListener('resize', doFit);

  term.onData(data => {
    if (window.AndroidBridge) {
      window.AndroidBridge.onInput(data);
    }
  });

  window.writeBase64 = function(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  };
</script>
</body>
</html>
