[package]
name = "moviebox-ffi"
version = "0.5.0"
edition = "2024"
description = "JNI bridge exposing the MovieBox-Tui Rust providers to the Android app"
publish = false

[lib]
name = "moviebox_ffi"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
moviebox-tui = { path = "../vendor" }
jni = "0.21"
ndk-context = "0.1"
once_cell = "1.20"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"