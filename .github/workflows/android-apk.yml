name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "27.2.12479018"
          sdk-components: "platforms;android-35,build-tools;35.0.0"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI bridge (arm64-v8a) via cargo-ndk
        run: |
          cd rust-bridge
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          echo "--- produced .so ---"
          ls -la ../app/src/main/jniLibs/arm64-v8a/
          test -f ../app/src/main/jniLibs/arm64-v8a/libmoviebox_ffi.so

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" > local.properties

      - name: Build APKs (debug + signed release)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify native library bundled in release APK
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -i "libmoviebox_ffi.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk

  release:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: MovieBox-release-${{ github.sha }}
          path: release-artifacts

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd release-artifacts
          apk="$(find . -name "*.apk" | head -n 1)"
          mv "$apk" MovieBox-arm64-v8a.apk
          gh release delete latest --cleanup-tag > /dev/null 2>&1 || true
          gh release create latest MovieBox-arm64-v8a.apk \
            --title "MovieBox Android - latest (arm64-v8a)" \
            --notes "Auto-built from main commit ${GITHUB_SHA}." \
            --prerelease

  versioned-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: MovieBox-release-${{ github.sha }}
          path: release-artifacts

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd release-artifacts
          apk="$(find . -name "*.apk" | head -n 1)"
          mv "$apk" MovieBox-arm64-v8a.apk
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" MovieBox-arm64-v8a.apk \
            --title "MovieBox Android $tag (arm64-v8a)" \
            --notes "Signed release build of MovieBox Android (arm64-v8a)." \
            --generate-notes
