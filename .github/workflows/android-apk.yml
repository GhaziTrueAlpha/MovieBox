name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Official MovieBox-Tui Rust Core
        run: git clone --depth 1 https://github.com/mesamirh/MovieBox-Tui.git vendor/MovieBox-Tui

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"

      - name: Set up Rust for Android arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Rust JNI Bridge from MovieBox-Tui
        run: python3 scripts/gen_rust_bridge.py vendor/MovieBox-Tui rust-bridge

      - name: Build Native Rust Library (libmoviebox_ffi.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust-bridge && cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
